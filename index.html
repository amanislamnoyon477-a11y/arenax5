<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArenaX – টুর্নামেন্ট ম্যানেজার</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090913;--c1:#141428;--c2:#1c1c38;--tx:#f2f2fb;--mu:#9a9ab8;--p:#8b5cf6;--b:#3b82f6;--g:linear-gradient(135deg,#8b5cf6,#3b82f6);--ok:#22c55e;--no:#ef4444;--wa:#f59e0b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}html,body{background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',system-ui,sans-serif;font-size:15px}
body{background:radial-gradient(circle at 20% -10%,#2a1a5e55,transparent 50%),radial-gradient(circle at 100% 10%,#16336e55,transparent 45%),var(--bg);min-height:100vh;padding-bottom:90px}
#app{max-width:720px;margin:auto;padding:14px;animation:fi .3s}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
h1{font-size:22px}h2{font-size:17px;margin:18px 0 10px}h3{font-size:16px}small,.m{color:var(--mu);font-size:12.5px}
.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:700;font-size:22px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--c1);border:1px solid #ffffff12;border-radius:16px;overflow:hidden;margin-bottom:12px}.pad{padding:14px}
.t{cursor:pointer;transition:transform .15s}.t:active{transform:scale(.98)}
.cv{height:92px;position:relative;display:flex;align-items:center;justify-content:center}.em{font-size:42px;filter:drop-shadow(0 4px 8px #0006)}
.bd{position:absolute;top:10px;left:10px;font-size:11px;padding:3px 9px;border-radius:99px;font-weight:700;background:#0008}
.bd.live{background:var(--no);animation:pl 1.4s infinite}.bd.upcoming{background:#2563eb}.bd.finished{background:#444}
@keyframes pl{50%{opacity:.6}}
.bd2{padding:12px 14px}.kv{display:flex;gap:8px;margin-top:10px}.kv>div{flex:1;background:var(--c2);border-radius:10px;padding:7px 9px}.kv small{display:block}.kv b{font-size:14px}
.hs{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}.hs .card{min-width:280px;scroll-snap-align:start}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0}.chip{padding:7px 14px;border-radius:99px;background:var(--c1);color:var(--mu);border:1px solid #ffffff14;white-space:nowrap;font:inherit;cursor:pointer}.chip.on{background:var(--g);color:#fff;border:0}
.btn{width:100%;padding:12px;border:0;border-radius:12px;background:var(--g);color:#fff;font:700 15px inherit;font-family:inherit;cursor:pointer;margin-top:10px}.btn.s{width:auto;padding:7px 14px;font-size:13px;margin:0}.btn.o{background:var(--c2)}.btn.r{background:var(--no)}.btn.k{background:var(--ok)}.btn:disabled{opacity:.5}
input,select,textarea{width:100%;padding:11px 12px;margin:4px 0 10px;border-radius:10px;border:1px solid #ffffff1f;background:var(--c2);color:var(--tx);font:inherit}label{font-size:13px;color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;background:#0d0d1bf2;backdrop-filter:blur(12px);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid #ffffff14;z-index:5}
nav button{background:0;border:0;color:var(--mu);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative;flex:1}nav button i{font-style:normal;font-size:20px}nav button.on{color:#fff}nav button.on i{filter:drop-shadow(0 0 6px var(--p))}
.dot{position:absolute;top:-2px;right:22%;background:var(--no);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
.mo{position:fixed;inset:0;background:#000b;z-index:9;display:flex;align-items:flex-end;justify-content:center}.mo>div{background:var(--c1);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;animation:fi .25s}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #ffffff0d}.row:last-child{border:0}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--c2)}.tag.ok{background:#22c55e30;color:var(--ok)}.tag.no{background:#ef444430;color:var(--no)}.tag.wa{background:#f59e0b30;color:var(--wa)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.pm{background:var(--c2);border:2px solid transparent;border-radius:12px;padding:10px 4px;color:var(--tx);font:inherit;font-weight:700;cursor:pointer}.pm.on{border-color:var(--p)}.pm small{display:block;font-weight:400}
.av{width:72px;height:72px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;margin:auto}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st .card{padding:14px;margin:0}.st b{font-size:22px;display:block}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-80px);background:var(--c2);border:1px solid var(--p);padding:10px 18px;border-radius:12px;z-index:20;transition:.3s}#toast.on{transform:translate(-50%,0)}
.room{background:linear-gradient(135deg,#22c55e22,#3b82f622);border:1px solid #22c55e55;border-radius:12px;padding:12px;margin:10px 0}
#sup{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;background:#25d366;color:#fff;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;text-decoration:none;box-shadow:0 6px 18px #0008}
pre{white-space:pre-wrap;font-family:inherit;color:#d6d6ee}
</style><script>
/* Firebase bridge: the app talks to window.claude (db/user); the module at the bottom fills it in after sign-in */
(function(){var r;window.__fb=new Promise(function(x){r=x});window.__fbRes=r;window.claude={use:function(n){return window.__fb.then(function(f){return f(n)})}}})();
</script>
</head><body>
<div id="toast"></div><a id="sup" href="https://wa.me/8801756518197" target="_blank" rel="noopener" title="WhatsApp সাপোর্ট">💬</a><div id="app"></div><div id="mo"></div>
<nav id="nav"></nav>
<script>
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s),taka=n=>'৳'+Number(n||0).toLocaleString('bn-BD');
const G=['linear-gradient(135deg,#7c3aed,#2563eb)','linear-gradient(135deg,#c026d3,#6d28d9)','linear-gradient(135deg,#0ea5e9,#7c3aed)','linear-gradient(135deg,#4f46e5,#06b6d4)'];
const MI={solo:'🎯',duo:'🤝',squad:'🛡️'},MN={solo:'Solo',duo:'Duo',squad:'Squad'},ST={live:'চলমান',upcoming:'আসন্ন',finished:'শেষ'},PM={bkash:'bKash',nagad:'Nagad',rocket:'Rocket'};
let db,user,uid,adm=false,tab='home',sel=null,flt='all',at='ov',pk='',seenN=-1;
const S={tours:[],regs:[],appr:[],notes:[],pays:[],cfg:{},prof:null,dep:[],dapp:[],acct:null,al:true,unl:false,ready:false,pl:false};
const fmt=t=>t?new Date(t).toLocaleString('bn-BD',{dateStyle:'medium',timeStyle:'short'}):'—';
const nums=k=>((S.cfg[k]||{}).nums||[]),on=k=>!!(S.cfg[k]&&S.cfg[k].on&&nums(k).length),T=id=>S.tours.find(t=>t.id===id),toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2400)};
const items=u=>(S.regs.find(r=>r.id===u)||{}).items||{},ap=(u,t)=>((S.appr.find(a=>a.id===u)||{}).items||{})[t];
const myReg=t=>items(uid)[t],stat=t=>myReg(t)?(ap(uid,t)||'pending'):null,cnt=t=>S.appr.filter(a=>(a.items||{})[t]==='approved').length;
const mine=n=>(!n.uid&&!n.aud)||n.uid===uid||(n.aud==='players'&&ap(uid,n.tid)==='approved');
const rows=s=>s.docs.map(d=>({id:d.id,...d.data()}));
const sub=(p,k)=>db.collection(p).onSnapshot(s=>{S[k]=rows(s);if(k==='notes')newN();draw()},()=>{S.err=1;draw()});
function newN(){const n=S.notes.filter(mine).length;if(seenN>=0&&n>seenN)toast('🔔 নতুন নোটিফিকেশন');seenN=n}
const unread=()=>{let l=0;try{l=+localStorage.getItem('ax_seen')||0}catch(e){}return S.notes.filter(n=>mine(n)&&n.ts>l).length};
async function init(){
 draw();
 try{user=await claude.use('user');db=await claude.use('db')}catch(e){}
 if(!db||!user){S.ready=S.al=true;return draw()}
 uid=await user.id();adm=user.canEdit();
 ['tournaments:tours','regs:regs','approvals:appr','notices:notes','payouts:pays','deposits:dep','depApprovals:dapp'].forEach(x=>{const[a,b]=x.split(':');sub(a,b)});
 db.doc('settings/pay').onSnapshot(s=>{S.cfg=s.exists?s.data():{};draw()});
 db.doc('data/users/'+uid+'/profile').onSnapshot(s=>{S.prof=s.exists?s.data():null;S.ready=true;draw()},()=>{S.ready=true;draw()});
 setTimeout(()=>{if(!S.ready){S.slow=1;draw()}},10000);
}
function draw(){
 const a=$('#app');
 if(!S.ready||!S.al){a.innerHTML=`<div class="pad" style="text-align:center;margin-top:30vh"><div class="logo">ArenaX</div><p class="m">${S.slow?'ডেটা লোড হচ্ছে না, নেটওয়ার্ক চেক করুন…':'লোড হচ্ছে…'}</p></div>`;$('#nav').innerHTML='';return}
 if(!db||!user){a.innerHTML=`<div class="pad" style="margin-top:20vh"><div class="logo">ArenaX</div><h2>সাইন ইন প্রয়োজন</h2><p class="m">claude.ai অ্যাকাউন্টে সাইন ইন করে লিংকটি খুলুন।</p></div>`;return}
 if(!S.prof){a.innerHTML=`<div style="margin-top:10vh;text-align:center"><div class="logo">ArenaX</div><h2>প্রোফাইল তৈরি করুন</h2><p class="m">টুর্নামেন্টে অংশ নিতে আপনার গেমিং পরিচয় দিন</p></div><div class="card pad" style="margin-top:16px"><label>গেমার নাম</label><input id="pn"><label>Player ID (গেম ইউআইডি)</label><input id="pi"><button class="btn" onclick="saveProf()">শুরু করুন</button></div>`;$('#nav').innerHTML='';return}
 const V={home,list,ranks,alerts,profile,admin}[sel?'detail':tab]||home;
 a.innerHTML=sel?detail():V();
 const nv=[['home','🏠','হোম'],['list','🎮','টুর্নামেন্ট'],['ranks','🏆','র‍্যাঙ্ক'],['alerts','🔔','নোটিশ'],['profile','👤','প্রোফাইল']];
 if(adm)nv.push(['admin','⚙️','অ্যাডমিন']);
 const u=unread();
 $('#nav').innerHTML=nv.map(([k,i,l])=>`<button class="${tab===k&&!sel?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}${k==='alerts'&&u?`<span class="dot">${u}</span>`:''}</button>`).join('');
}
function go(k){tab=k;sel=null;if(k==='alerts'){try{localStorage.setItem('ax_seen',Date.now())}catch(e){}}draw();scrollTo(0,0)}
async function saveProf(){const n=$('#pn').value.trim(),i=$('#pi').value.trim();if(!n||!i)return toast('সব তথ্য দিন');try{await db.doc('data/users/'+uid+'/profile').set({name:n,playerId:i});toast('স্বাগতম!')}catch(e){toast('সেভ হয়নি')}}
function card(t){const i=S.tours.indexOf(t);return `<div class="card t" onclick="sel='${t.id}';draw();scrollTo(0,0)"><div class="cv" style="background:${G[i%4]}"><span class="bd ${t.status}">${ST[t.status]||''}</span><span class="em">${MI[t.mode]||'🎮'}</span></div><div class="bd2"><h3>${E(t.title)}</h3><p class="m">${E(t.game||'')} · ${MN[t.mode]} · ${fmt(t.start)}</p><div class="kv"><div><small>এন্ট্রি</small><b>${t.fee>0?taka(t.fee):'ফ্রি'}</b></div><div><small>প্রাইজ পুল</small><b>${taka(t.prize)}</b></div><div><small>প্লেয়ার</small><b>${cnt(t.id)}/${t.max||'∞'}</b></div></div></div></div>`}
const by=s=>S.tours.filter(t=>t.status===s);
const empty=m=>`<div class="card pad m" style="text-align:center">${m}</div>`;
function home(){
 const f=S.tours.filter(t=>t.featured&&t.status!=='finished');
 const sec=(h,l)=>l.length?`<h2>${h}</h2>`+l.map(card).join(''):'';
 return `<div class="top"><div><small>স্বাগতম</small><h1>${E(S.prof.name)}</h1></div><div style="text-align:right"><div class="logo">ArenaX</div><small onclick="addM()" style="cursor:pointer">💼 ${taka(bal(uid))} · ＋ Add</small></div></div>
 ${S.err?'<p class="m">⚠️ ডেটা এখন পাওয়া যাচ্ছে না</p>':''}
 ${f.length?`<h2>⭐ ফিচার্ড</h2><div class="hs">${f.map(card).join('')}</div>`:''}
 ${sec('🔴 চলমান',by('live'))}${sec('⏳ আসন্ন',by('upcoming'))}${sec('✅ শেষ হয়েছে',by('finished'))}
 ${S.tours.length?'':empty(adm?'কোনো টুর্নামেন্ট নেই। অ্যাডমিন ট্যাব থেকে প্রথম টুর্নামেন্ট তৈরি করুন।':'এখনো কোনো টুর্নামেন্ট নেই।')}`;
}
function list(){
 const l=S.tours.filter(t=>flt==='all'||t.status===flt||t.mode===flt);
 return `<h1>টুর্নামেন্ট</h1><div class="chips">${[['all','সব'],['live','চলমান'],['upcoming','আসন্ন'],['finished','শেষ'],['solo','Solo'],['duo','Duo'],['squad','Squad']].map(([k,n])=>`<button class="chip ${flt===k?'on':''}" onclick="flt='${k}';draw()">${n}</button>`).join('')}</div>${l.map(card).join('')||empty('কিছু পাওয়া যায়নি')}`;
}
function detail(){
 const t=T(sel);if(!t){sel=null;return home()}
 const s=stat(t.id),full=t.max&&cnt(t.id)>=t.max,i=S.tours.indexOf(t);
 const lab={pending:'<span class="tag wa">অনুমোদনের অপেক্ষায়</span>',approved:'<span class="tag ok">নিশ্চিত</span>',rejected:'<span class="tag no">বাতিল</span>'};
 let btn=t.status==='finished'?'':s?`<p style="margin-top:10px">আপনার রেজিস্ট্রেশন: ${lab[s]}</p>`:full?'<button class="btn" disabled>স্লট পূর্ণ</button>':`<button class="btn" onclick="joinM('${t.id}')">জয়েন করুন ${t.fee>0?'· '+taka(t.fee):'· ফ্রি'}</button>`;
 const room=s==='approved'&&t.roomOn?`<div class="room"><b>🔑 রুম তথ্য</b><p>Room ID: <b>${E(t.roomId)}</b></p><p>Password: <b>${E(t.roomPass)}</b></p></div>`:'';
 const win=(t.winners||[]).length?`<h2>🏆 বিজয়ী</h2><div class="card pad">${t.winners.map(w=>`<div class="row"><span>#${w.rank} ${E(w.name)}</span><b>${taka(w.prize)}</b></div>`).join('')}</div>`:'';
 return `<button class="chip" onclick="sel=null;draw()">← ফিরে যান</button>
 <div class="card" style="margin-top:10px"><div class="cv" style="background:${G[i%4]};height:130px"><span class="bd ${t.status}">${ST[t.status]}</span><span class="em" style="font-size:60px">${MI[t.mode]}</span></div><div class="pad"><h1>${E(t.title)}</h1><p class="m">${E(t.game||'')} · ${MN[t.mode]}</p>
 <div class="kv"><div><small>এন্ট্রি</small><b>${t.fee>0?taka(t.fee):'ফ্রি'}</b></div><div><small>প্রাইজ</small><b>${taka(t.prize)}</b></div><div><small>প্লেয়ার</small><b>${cnt(t.id)}/${t.max||'∞'}</b></div></div>
 <p style="margin-top:10px">🕒 ${fmt(t.start)}</p>${btn}</div></div>${det(t)}${room}${win}
 ${t.prizeDetails?`<h2>💰 প্রাইজ বিবরণ</h2><div class="card pad"><pre>${E(t.prizeDetails)}</pre></div>`:''}
 ${t.rules?`<h2>📜 নিয়মাবলি</h2><div class="card pad"><pre>${E(t.rules)}</pre></div>`:''}`;
}
function modal(h){$('#mo').innerHTML=`<div class="mo" onclick="if(event.target===this)closeM()"><div>${h}</div></div>`}
const closeM=()=>$('#mo').innerHTML='';
function joinM(id){
 const t=T(id);pk='';
 let h=`<h3>${E(t.title)}</h3><p class="m">${MN[t.mode]} মোড</p>`;
 if(t.mode!=='solo')h+=`<label>টিমের নাম</label><input id="jt"><label>টিম মেম্বারদের Player ID (কমা দিয়ে)</label><input id="jm">`;
 if(t.fee>0)h+=`<p style="margin-top:8px">এন্ট্রি ফি <b>${taka(t.fee)}</b>। নিচের নম্বরে Send Money করে TrxID দিন।</p>${bal(uid)>=t.fee?`<button class="pm" id="pm_wallet" style="width:100%;margin-top:8px" onclick="pickW()">💼 ওয়ালেট ব্যালেন্স ব্যবহার করুন (${taka(bal(uid))})</button>`:''}<div class="seg">${Object.keys(PM).filter(on).map(k=>`<button class="pm" id="pm_${k}" onclick="pick('${k}')">${PM[k]}<small hidden>${E(nums(k)[0]||'নম্বর নেই')}</small></button>`).join('')}</div><div id="pnb" class="room" style="display:none"></div><label>আপনার প্রেরক নম্বর</label><input id="js" inputmode="tel"><label>Transaction ID</label><input id="jx">`;
 modal(h+`<button class="btn" onclick="submitJoin('${id}')">রেজিস্ট্রেশন জমা দিন</button>`);
}
function pick(k){pk=k;document.querySelectorAll('.pm').forEach(b=>b.classList.toggle('on',b.id==='pm_'+k));const b=$('#pnb');b.style.display='block';b.innerHTML='<b>'+E(PM[k])+' নম্বর (Send Money করুন)</b>'+nums(k).map(n=>`<p style="font-size:17px;margin-top:6px">${E(n)} <button class="btn s o" onclick="navigator.clipboard&&navigator.clipboard.writeText('${E(n)}');toast('কপি হয়েছে')">কপি</button></p>`).join('')}
async function submitJoin(id){
 const t=T(id),v=x=>($(x)?$(x).value.trim():'');
 if(t.max&&cnt(id)>=t.max)return toast('স্লট পূর্ণ');
 const r={ts:Date.now(),name:S.prof.name,playerId:S.prof.playerId,fee:+t.fee||0};
 if(t.mode!=='solo'){r.team=v('#jt');r.members=v('#jm');if(!r.team)return toast('টিমের নাম দিন')}
 if(t.fee>0){r.method=pk;r.sender=v('#js');r.trx=v('#jx');if(pk==='wallet'){if(bal(uid)<t.fee)return toast('ব্যালেন্স কম, Add Money করুন')}else if(!pk||!r.sender||!r.trx)return toast('পেমেন্ট তথ্য পূরণ করুন')}
 try{await db.doc('regs/'+uid).set({items:{...items(uid),[id]:r}});closeM();toast('রেজিস্ট্রেশন জমা হয়েছে ✅')}catch(e){toast('জমা হয়নি, আবার চেষ্টা করুন')}
}
function ranks(){

init();
</script><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,sendPasswordResetEmail,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,collection,onSnapshot,getDoc,setDoc,updateDoc,deleteDoc,addDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{FIREBASE_CONFIG,ADMIN_EMAILS,DEFAULT_PAY}from"./firebase-config.js";
const app=initializeApp(FIREBASE_CONFIG),auth=getAuth(app),fs=getFirestore(app);
const ov=document.createElement('div');
ov.style.cssText='position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;display:none';
ov.innerHTML=`<div style="max-width:420px;margin:auto;padding:14px"><div style="text-align:center;margin-top:8vh"><div class="logo">ArenaX</div><h2>সাইন ইন</h2></div><div class="card pad"><button class="btn" id="ax_g">Google দিয়ে সাইন ইন</button><p class="m" style="text-align:center;margin:10px 0">অথবা ইমেইল দিয়ে</p><input id="ax_em" type="email" placeholder="ইমেইল" autocomplete="email"><input id="ax_pw" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" autocomplete="current-password"><button class="btn" id="ax_si">সাইন ইন</button><button class="btn o" id="ax_su">নতুন অ্যাকাউন্ট তৈরি করুন</button><button class="btn o" id="ax_fp">পাসওয়ার্ড ভুলে গেছেন?</button><p id="ax_er" class="m" style="color:#f87171;margin-top:10px"></p></div></div>`;

const q=id=>ov.querySelector('#'+id),er=m=>q('ax_er').textContent=m;
const MSG={'auth/invalid-credential':'ইমেইল বা পাসওয়ার্ড ভুল','auth/wrong-password':'ইমেইল বা পাসওয়ার্ড ভুল','auth/user-not-found':'এই ইমেইলে অ্যাকাউন্ট নেই','auth/email-already-in-use':'এই ইমেইলে আগে থেকেই অ্যাকাউন্ট আছে','auth/weak-password':'পাসওয়ার্ড কমপক্ষে ৬ অক্ষর','auth/invalid-email':'সঠিক ইমেইল দিন','auth/popup-closed-by-user':'সাইন ইন বাতিল হয়েছে','auth/too-many-requests':'অনেকবার চেষ্টা হয়েছে, পরে চেষ্টা করুন'};
const run=async f=>{er('');try{await f()}catch(e){er(MSG[e.code]||('ত্রুটি: '+(e.code||e.message)))}};

q('ax_fp').onclick=()=>run(async()=>{const e=q('ax_em').value.trim();if(!e)return er('আগে ইমেইল লিখুন');await sendPasswordResetEmail(auth,e);er('পাসওয়ার্ড রিসেটের লিংক ইমেইলে পাঠানো হয়েছে ✅')});

const wrapS=s=>({id:s.id,exists:s.exists(),data:()=>s.data()});
const wrapQ=s=>({docs:s.docs.map(d=>({id:d.id,exists:true,data:()=>d.data()}))});
function build(u,admin){
 const docRef=p=>{const r=doc(fs,p);return{get:async()=>wrapS(await getDoc(r)),set:d=>setDoc(r,d),update:d=>updateDoc(r,d),delete:()=>deleteDoc(r),onSnapshot:(n,e)=>onSnapshot(r,s=>n(wrapS(s)),e)}};
 const colRef=p=>{const c=collection(fs,p),own=['regs','deposits'].includes(p)&&!admin;
  return{doc:id=>docRef(id?p+'/'+id:doc(c).path),add:async d=>docRef((await addDoc(c,d)).path),
   onSnapshot:(n,e)=>own?onSnapshot(doc(fs,p+'/'+u.uid),s=>n({docs:s.exists()?[{id:s.id,exists:true,data:()=>s.data()}]:[]}),e):onSnapshot(c,s=>n(wrapQ(s)),e)}};
 const dbo={doc:docRef,collection:colRef},user={id:async()=>u.uid,canEdit:()=>admin,isOwner:()=>admin};
 return n=>n==='db'?dbo:n==='user'?user:null;
}
let started=false;
onAuthStateChanged(auth,async u=>{
 if(!u){ov.style.display='block';return}
 ov.style.display='none';
 window.AX_EMAIL=u.email||'';

 if(started)return;started=true;window.__fbRes(build(u,admin));
});
